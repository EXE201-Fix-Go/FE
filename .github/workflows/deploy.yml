name: Deploy to GitHub Pages

on:
  push:
    branches: [main, test-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Đặt ở Settings → Secrets and variables → Actions → Variables. Để trống thì dùng mặc định trong code.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPPORT_PHONE: ${{ vars.VITE_SUPPORT_PHONE }}
          # '/' khi có tên miền riêng; '/FE/' khi chạy ở https://exe201-fix-go.github.io/FE/
          VITE_BASE: ${{ vars.VITE_BASE }}
      - name: SPA fallback for GitHub Pages
        # Mở thẳng /partner/login (hoặc F5 ở trang con) sẽ ra 404 nếu thiếu tệp này.
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
